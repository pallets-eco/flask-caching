version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: weekly
    time: "08:00"
  groups:
    dependencies:
      patterns:
        - "*"
    security:
      applies-to: security-updates
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    time: "08:00"
  groups:
    actions:
      patterns:
        - "*"
